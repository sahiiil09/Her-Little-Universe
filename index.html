<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Quiet Goodbye</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:wght@400;500&display=swap"
        rel="stylesheet"
    >

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">

    <!-- JavaScript File -->
    <script src="script.js" defer></script>

</head>

<body>

    <!-- Background -->
    <div class="background"></div>

    <!-- Main Page -->
    <main class="page">

        <div class="card">

            <div class="eyebrow">
                A PERSONAL NOTE
            </div>

            <h1>
                A quiet<br>
                goodbye.
            </h1>

            <p class="intro">
                Some things are better left in the past.
            </p>

            <div class="divider"></div>

            <section class="message">

                <h2>
                    Sorry, there's nothing here anymore.
                </h2>

                <p>
                    I've chosen to let this go.
                </p>

                <p>
                    This little place is no longer here.
                </p>

                <p>
                    Thank you for visiting.
                </p>

            </section>

            <div class="closing">
                — A chapter quietly closed.
            </div>

        </div>

        <footer>
            SOME THINGS ARE BETTER LEFT UNSAID
        </footer>

    </main>

</body>

</html>
